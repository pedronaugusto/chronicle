name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # The whole suite in every build mode. A journal's promises are about what
  # survives a crash, and the safety checks that catch a wrong one are only
  # compiled into some of these, so all four run.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Formatting
        run: zig fmt --check src examples build.zig

      - name: Test — Debug
        run: zig build test -Doptimize=Debug

      - name: Test — ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe

      - name: Test — ReleaseFast
        run: zig build test -Doptimize=ReleaseFast

      - name: Test — ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall

      # Built AND run: an example that only compiles proves the names still
      # resolve, and running it is what proves the package still works.
      - name: Examples
        run: zig build examples

  # README.md's Usage block is a region of examples/usage.zig, which the job
  # above runs. This is what keeps the snippet a reader copies and the code CI
  # executes the same text.
  docs:
    name: documented usage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/readme_usage.sh --check

  # Compile-only coverage of the targets the suite cannot execute on. These
  # prove the sources and the build graph are portable; the `test` job above
  # is what proves behaviour.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}
