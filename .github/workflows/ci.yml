name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # The whole suite in every build mode. A journal's promises are about what
  # survives a crash, and the safety checks that catch a wrong one are only
  # compiled into some of these, so all four run.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Formatting
        run: zig fmt --check src examples build.zig

      - name: Test — Debug
        run: zig build test -Doptimize=Debug

      - name: Test — ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe

      - name: Test — ReleaseFast
        run: zig build test -Doptimize=ReleaseFast

      - name: Test — ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall

      # The suite under ThreadSanitizer. A journal is one mutex between an
      # appender and the tasks waiting on it, and a clean reopen inspects the
      # segments concurrently; a race there is a claim a detector can check and
      # a reader cannot. Debug, because that is the mode the detector
      # instruments most completely. Linux only: Windows has no runtime for it,
      # and on the hosted macOS runner the instrumented suite is killed by a
      # segfault before its first test reports, while the same suite passes
      # under ThreadSanitizer on a Mac, where it is run before a release.
      - name: Test — ThreadSanitizer
        if: runner.os == 'Linux'
        run: zig build test -Dthread-sanitizer -Doptimize=Debug --test-timeout 120s

      # Built AND run: an example that only compiles proves the names still
      # resolve, and running it is what proves the package still works.
      - name: Examples
        run: zig build examples

  # README.md's Usage block is a region of examples/usage.zig, which the job
  # above runs. This is what keeps the snippet a reader copies and the code CI
  # executes the same text.
  docs:
    name: documented usage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/readme_usage.sh --check

  # Compile-only coverage of the targets the suite cannot execute on. These
  # prove the sources and the build graph are portable; the `test` job above
  # is what proves behaviour.
  #
  # Two of them name a CPU. The checksum has a path per instruction set,
  # chosen from the target's features, and a baseline target compiles the
  # table and nothing else -- so a target that has the instruction is built
  # too, or the code that uses it would never be seen by a compiler. The
  # runners the `test` job uses have it and run that path.
  cross-compile:
    name: cross (${{ matrix.target }}${{ matrix.cpu && format(' {0}', matrix.cpu) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
          - target: x86_64-linux-gnu
            cpu: x86_64_v2
          - target: aarch64-linux-gnu
          - target: aarch64-linux-gnu
            cpu: cortex_a72
          - target: x86_64-linux-musl
          - target: x86_64-windows-gnu
          - target: aarch64-windows-gnu
          - target: x86_64-macos
          - target: aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}${{ matrix.cpu && format(' -Dcpu={0}', matrix.cpu) || '' }}
