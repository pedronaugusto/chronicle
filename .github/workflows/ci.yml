name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
      adopt:
        description: Initialize absent source ledgers from findings already on main
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push'
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@9e72aac1b9f2837716105dca4de617685a4ca284
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      preflight-ref: 9e72aac1b9f2837716105dca4de617685a4ca284
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@9e72aac1b9f2837716105dca4de617685a4ca284
    with:
      preflight-ref: 9e72aac1b9f2837716105dca4de617685a4ca284
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      adopt: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt }}
      attest: ${{ github.event_name == 'push' }}
      # Generated from ci/workflow.json with zig build plan -- --full false.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=Debug","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":""}]}
      # Generated from ci/workflow.json with zig build plan -- --full true.
      full-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"00d2e45d7ab2fc0c","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"292b87a01cb7f313","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=ReleaseFast -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"6ad0483faf0326e4","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"474fb72f8e7d7b6e","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"c8e8ed930b788a2c","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"5122336725f8da6b","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"4332b14b7e345673","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"119e3d2ddf82d539","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"check","args":"-Doptimize=ReleaseSmall","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"4515d8efc7af7d51","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"1b13795de3f7fdd5","artifact":""},{"os":"ubuntu-latest","name":"ThreadSanitizer (Linux)","step":"test","args":"-Dthread-sanitizer -Doptimize=Debug -Dci-lint=false","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"c7d22b63196661b7","artifact":""}]}
